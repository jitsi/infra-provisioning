jenkins:
  clouds:
    - docker:
        name: "docker"
        dockerApi:
          dockerHost:
            uri: "unix:///var/run/docker.sock"
        containerCap: 100
        templates:
          - labelString: "ops-agent"
            name: "docker"
            dockerTemplateBase:
              image: "${OPS_AGENT_IMAGE:-aaronkvanmeerten/ops-agent}"
              mounts:
                - "type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock"
              devicesString: "/dev/fuse"
              securityOptsString: "apparmor=unconfined"
              capabilitiesToAddString: "SYS_ADMIN\nIPC_LOCK"
              # Agents used to bind-mount /home/git, a local mirror kept by the
              # ops-git container, and point GIT_ALTERNATE_OBJECT_DIRECTORIES at it.
              # That is gone: the *_MIRROR_REPO variables below send checkouts to
              # the in-region Gitea mirror instead. Utils.CheckoutInfraRepo prefers
              # it and falls back to github on any failure, so a github outage no
              # longer stops a build checking out.
              #
              # Anonymous on purpose: Gitea serves infra-configuration and
              # infra-provisioning without a login, and MirrorCredentialsId returns
              # null for an https mirror unless INFRA_MIRROR_CREDENTIALS_ID names a
              # username/password credential.
              #
              # The private repo is served with a login, so its mirror URL is only
              # useful alongside INFRA_MIRROR_CREDENTIALS_ID -- set on their own it
              # would make every build try an anonymous clone, get 401 and fall back
              # to github with a WARNING. They are set together here, naming a
              # Jenkins username/password credential holding the Gitea read user
              # (username `mirror-reader`, password from
              # secret/default/gitea/read-user, published to jvb-bucket-<env> as
              # the gitea-read-user object).
              #
              # INTERIM. The durable answer is for SetupRepos to read that object at
              # checkout time with the OCI credentials every job already has, so the
              # credential cannot drift: a static Jenkins copy goes stale the moment
              # seed-gitea-read-user.sh is run with ROTATE=true, and because
              # CheckoutInfraRepo treats every mirror failure as non-fatal, a stale
              # one degrades silently to github instead of failing loudly. Whoever
              # rotates that password must update this credential in the same change.
              #
              # MEET_MIRROR_REPO is for the jitsi-meet checkout in the synthetic
              # tests, which clone the test specs on every run. jitsi-meet is
              # mirrored only where the build tooling lives (ops-dev, ops-prod --
              # GITEA_JITSI_MEET_ENVIRONMENTS in scripts/deploy-nomad-gitea-mirror.sh),
              # which is exactly here. It is a separate variable rather than an
              # override of MEET_REPO because MEET_REPO is a job *parameter*, and a
              # parameter always beats an agent environment variable.
              #
              # The mirror is reachable because jenkins-ops and the ops-prod
              # us-phoenix-1 mirror share the 10.34/16 VCN. An agent without that
              # route would simply fail over to github.
              environmentsString: |
                INFRA_PROVISIONING_MIRROR_REPO=https://ops-prod-us-phoenix-1-git.jitsi.net/jitsi/infra-provisioning.git
                INFRA_CONFIGURATION_MIRROR_REPO=https://ops-prod-us-phoenix-1-git.jitsi.net/jitsi/infra-configuration.git
                INFRA_CUSTOMIZATIONS_MIRROR_REPO=https://ops-prod-us-phoenix-1-git.jitsi.net/jitsi/infra-customizations-private.git
                INFRA_MIRROR_CREDENTIALS_ID=gitea-mirror-reader
                MEET_MIRROR_REPO=https://ops-prod-us-phoenix-1-git.jitsi.net/jitsi/jitsi-meet.git
            remoteFs: "/home/jenkins/agent"
            connector:
              attach:
                user: "jenkins"
            instanceCapStr: "50"
            retentionStrategy:
              idleMinutes: 10
            pullStrategy: PULL_LATEST
            pullTimeout: 300
            removeVolumes: true

unclassified:
  location:
    url: "${JENKINS_URL}"
