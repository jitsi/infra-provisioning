- job:
    name: rotate-coturn
    display-name: rotate coturn
    description: 'Gracefully replace coturn instances in an environment/region with new instances.'      
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - string:
          name: RELEASE_BRANCH
          default: main
          description: "Name of an existing infra branch to use when creating the release, defaults to 'main'."
          trim: true
      - string:
          name: ORACLE_REGION
          description: "Oracle Region to build in"
          trim: true
      - infra-repo-params
      - governance-params

    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/rotate-coturn/Jenkinsfile
      lightweight-checkout: true
