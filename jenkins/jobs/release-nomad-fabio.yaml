- job:
    name: release-nomad-fabio
    display-name: release nomad fabio
    description: "release fabio to nomad in one or more regions in an environment."
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - string:
          name: REGIONS
          description: "REGIONS to build in, defaults to NOMAD_REGIONS for the environment."
          trim: true
      - infra-repo-params
      - governance-params

    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/release-nomad-fabio/Jenkinsfile
      lightweight-checkout: true
