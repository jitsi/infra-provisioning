- job:
    name: lookup-release-pin
    display-name: lookup release pin
    concurrent: true
    parameters:
      - string:
          name: CUSTOMER_ID
          default:
          description: "The customer ID."
          trim: true
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/lookup-release-pin/Jenkinsfile
      lightweight-checkout: true
