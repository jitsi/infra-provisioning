- job:
    name: lookup-release-pin
    display-name: lookup release pin
    concurrent: true
    parameters:
      - string:
          name: CUSTOMER_ID
          default:
          description: "The customer ID."
          trim: true
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: prod-8x8
          description: "Environment the customer belongs to, defaults to 'prod-8x8'. Must be one that sets USE_RELEASE_BACKENDS (prod-8x8, stage-8x8, meet-jit-si)."
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/lookup-release-pin/Jenkinsfile
      lightweight-checkout: true
