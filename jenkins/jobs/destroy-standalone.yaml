- job:
    name: destroy-standalone
    display-name: destroy standalone
    concurrent: true
    parameters:
      - string:
          name: UNIQUE_ID
          default:
          description: "UNIQUE_ID used to identify standalone, defaults to 'standalone' in script."
          trim: true
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - string:
          name: ORACLE_REGION
          description: "Region to destroy resources in"
          trim: true
      - string:
          name: CLOUD_NAME
          description: "AWS Cloud to destroy resources in."
          trim: true
      - string:
          name: CLOUD_PROVIDER
          default: oracle
          description: "Cloud to build for, defaults to 'oracle'."
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/destroy-standalone/Jenkinsfile
      lightweight-checkout: true
