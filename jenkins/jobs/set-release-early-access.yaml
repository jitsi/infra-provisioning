- job:
    name: set-release-early-access
    display-name: set release early access
    description: 'Mark a release as early access, i.e., a release that customers can use to test new features.'
    concurrent: true
    parameters:
      - string:
          name: RELEASE_NUMBER
          default:
          description: "The release number to set as EARLY_ACCESS."
          trim: true
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/set-release-early-access/Jenkinsfile
      lightweight-checkout: true
