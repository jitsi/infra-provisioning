- job:
    name: provision-coturn
    display-name: provision coTURN
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - string:
          name: DESIRED_CAPACITY
          description: "Number of instances in the pool, defaults to 2"
      - string:
          name: CLOUD_PROVIDER
          default: oracle
          description: "Cloud Provider, defaults to 'oracle'"
          trim: true
      - string:
          name: RELEASE_BRANCH
          default: main
          description: "Name of an existing infra branch to use when creating the release, defaults to 'main'."
          trim: true
      - string:
          name: COTURN_RELEASE_NUMBER
          description: "Coturn Release number, defaults to 0"
          trim: true
      - string:
          name: CLOUD_NAME
          description: "Name of cloud to build in, for AWS"
          trim: true
      - string:
          name: ORACLE_REGION
          description: "Name of region to build in, for Oracle"
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/provision-coturn/Jenkinsfile
      lightweight-checkout: true
