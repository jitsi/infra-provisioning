- job:
    name: monitor-haproxy
    display-name: monitor haproxy
    description: 'Runs haproxy-status.sh against the haproxy fleet to determine if there are stick table inconsistencies, and repairs them if needed. This helps mitigate split brains.'
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          description: "Environment to run haproxy monitor in."
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/monitor-haproxy/Jenkinsfile
      lightweight-checkout: true
