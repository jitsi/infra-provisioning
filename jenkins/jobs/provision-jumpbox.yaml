- job:
    name: provision-jumpbox
    display-name: provision jumpbox
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ORACLE_GIT_BRANCH
          default: main
          description: "Controls checkout branch for jumpbox, defaults to 'main'."
          trim: true
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - string:
          name: ORACLE_REGION
          default: us-phoenix-1
          description: "Region to build in, defaults to 'us-phoenix-1'."
          trim: true
      - string:
          name: CLOUD_PROVIDER
          default: oracle
          description: "Cloud to build for, defaults to 'oracle'."
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/jumpbox/Jenkinsfile
      lightweight-checkout: true
