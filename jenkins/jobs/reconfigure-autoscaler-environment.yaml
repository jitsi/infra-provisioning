- job:
    name: reconfigure-autoscaler-environment
    display-name: reconfigure autoscaler environment
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          description: "Environment to trigger reconfiguration."
          trim: true
      - string:
          name: INFRA_CUSTOMIZATIONS_REPO
          default: git@github.com:jitsi/infra-customizations.git
          description: "Repo with customized configurations, defaults to 'git@github.com:jitsi/infra-customizations.git'."
          trim: true
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/reconfigure-autoscaler-environment/Jenkinsfile
      lightweight-checkout: true
