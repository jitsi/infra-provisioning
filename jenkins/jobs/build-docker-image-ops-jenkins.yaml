- job:
    name: build-docker-image-ops-jenkins
    display-name: build docker image ops-jenkins
    concurrent: false
    parameters:
      - infra-branch-param
      - string:
          name: TAG
          description: "Docker image tag; defaults to git short hash if not set."
          trim: true

    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/build-docker-image-ops-jenkins/Jenkinsfile
      lightweight-checkout: true
