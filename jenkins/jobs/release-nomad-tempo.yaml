- job:
    name: release-nomad-tempo
    display-name: release nomad tempo
    description: "release tempo to nomad in one or more regions in an environment."
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          description: "Environment to build in."
          trim: true
      - string:
          name: REGIONS
          description: "REGIONS to build in, defaults to NOMAD_REGIONS for the environment."
          trim: true
      - string:
          name: JOB_TYPE
          default: tempo
          description: "Nomad job type to release, defaults to 'tempo' do not change"
          trim: true
      - infra-repo-params
      - governance-params

    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/release-nomad-job/Jenkinsfile
      lightweight-checkout: true
