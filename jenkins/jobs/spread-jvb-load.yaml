- job:
    name: spread-jvb-load
    display-name: spread JVB load
    description: 'Move up to 100 endpoints off a JVB.'      
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - string:
          name: JVB_NAME
          description: "Name of the JVB like 'meet-jit-si-jvb-50-85-122'."
          trim: true
      - string:
          name: MOVE_FRACTION
          description: "Fraction of endpoints to move off the JVB, defaults to 0.3 in script."
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/spread-jvb-load/Jenkinsfile
      lightweight-checkout: true
