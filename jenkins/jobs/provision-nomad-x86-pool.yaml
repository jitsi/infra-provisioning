- job:
    name: provision-nomad-x86-pool
    display-name: provision nomad x86 instance pool
    description: 'Provision a nomad x86 pool for a new environment/region.'
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - string:
          name: POOL_TYPE
          default: "x86"
          description: "Type of pool to build, defaults to 'x86'."
          trim: true
      - string:
          name: POOL_PUBLIC
          description: "Assign public IP to pool nodes, set to 'true' for public IP, defaults to 'false' in scripts."
          trim: true
      - string:
          name: CLOUD_PROVIDER
          default: oracle
          description: "Cloud Provider, defaults to 'oracle'"
          trim: true
      - string:
          name: RELEASE_BRANCH
          default: main
          description: "Name of an existing infra branch to use when creating the release, defaults to 'main'."
          trim: true
      - string:
          name: ORACLE_REGION
          description: "Oracle Region to build in"
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/provision-nomad-instance-pool/Jenkinsfile
      lightweight-checkout: true
