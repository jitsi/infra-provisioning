- job:
    name: rotate-nomad-instance-pool
    display-name: rotate nomad instance pool
    description: 'Gracefully replace the instances of a nomad instance pool (terraform/nomad-instance-pool stack, e.g. skynet-cpu or x86) in an environment/region with new instances.'
    concurrent: false
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - string:
          name: ORACLE_REGION
          description: "Oracle Region to build in"
          trim: true
      - string:
          name: POOL_TYPE
          description: "Type of pool to rotate, e.g. 'skynet-cpu' or 'x86'. Needs a matching terraform/nomad-instance-pool/create-nomad-<POOL_TYPE>-pool-stack.sh."
          trim: true
      - string:
          name: POOL_PUBLIC
          description: "Set to 'true' or 'false' to override the pool subnet. Empty keeps the subnet of the current instance configuration."
          trim: true
      - string:
          name: RELEASE_BRANCH
          default: main
          description: "Infra branch the new instances check out at boot, defaults to 'main'."
          trim: true
      - infra-repo-params
      - governance-params

    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/rotate-nomad-instance-pool/Jenkinsfile
      lightweight-checkout: true
