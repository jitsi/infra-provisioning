- job:
    name: provision-nomad-wavefront-proxy
    display-name: provision nomad wavefront proxy
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          description: "Environment to provision in"
          trim: true
      - string:
          name: ORACLE_REGION
          description: "Region to provision in"
          trim: true
      - string:
          name: JOB_TYPE
          default: wavefront-proxy
          description: "Nomad job type to provision, defaults to 'wavefront-proxy' do not change"
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/provision-nomad-job/Jenkinsfile
      lightweight-checkout: true
