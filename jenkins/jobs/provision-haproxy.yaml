- job:
    name: provision-haproxy
    display-name: provision HAProxy
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - string:
          name: CLOUD_PROVIDER
          default: oracle
          description: "Cloud Provider, defaults to 'oracle'"
          trim: true
      - string:
          name: RELEASE_BRANCH
          default: main
          description: "Name of an existing infra branch to use when creating the release, defaults to 'main'."
          trim: true
      - string:
          name: HAPROXY_RELEASE_NUMBER
          description: "HAProxy Release number, defaults to 0"
          trim: true
      - string:
          name: CLOUD_NAME
          description: "Name of cloud to build in, for AWS"
          trim: true
      - string:
          name: ORACLE_REGION
          description: "Name of region to build in, for Oracle"
          trim: true
      - string:
          name: SHAPE
          description: "Override CPU shape for HAProxy node. Can be VM.Standard.E4.Flex VM.Standard.E5.Flex VM.Standard.E6.Flex VM.Standard.A1.Flex or VM.Standard.A2.Flex"
          trim: true
      - string:
          name: OCPUS
          description: "Override HAProxy instance CPU count"
          trim: true
      - string:
          name: MEMORY_IN_GBS
          description: "Override HAProxy instance memory"
          trim: true
      - string:
          name: LOAD_BALANCER_MAX_BANDWIDTH
          default: "500"
          description: "Override OCI load balancer maximum bandwidth in Mbps, defaults to 500."
          trim: true
      - string:
          name: UPDATE_SECURITY_GROUP
          description: "Update the HAProxy security group's terraform stack. This will disrupt live connections and should only be done if ports are being added/removed."
          default: false
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/provision-haproxy/Jenkinsfile
      lightweight-checkout: true
