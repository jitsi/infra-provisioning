- job:
    name: destroy-selenium-grid
    display-name: destroy selenium grid
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: torture-test
          description: "Environment to build in, defaults to 'torture-test'."
          trim: true
      - string:
          name: GRID_NAME
          description: "GRID_NAME tag used to differentiate grids"
          trim: true
      - string:
          name: CLOUD_PROVIDER
          default: oracle
          description: "Cloud Provider, defaults to 'oracle'"
          trim: true
      - string:
          name: ORACLE_REGION
          default: us-phoenix-1
          description: "Oracle Region to build in"
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/destroy-selenium-grid/Jenkinsfile
      lightweight-checkout: true
