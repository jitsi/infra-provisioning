- job:
    name: provision-tempo-bucket
    display-name: provision tempo bucket
    description: "provision OCI object storage bucket for tempo tracing data"
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          description: "Environment to provision in"
          trim: true
      - string:
          name: ORACLE_REGION
          default: eu-frankfurt-1
          description: "Oracle Region to provision in, defaults to 'eu-frankfurt-1'"
          trim: true
      - infra-repo-params

    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/provision-tempo-bucket/Jenkinsfile
      lightweight-checkout: true
