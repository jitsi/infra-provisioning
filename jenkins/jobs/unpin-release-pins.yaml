- job:
    name: unpin-release-pins
    display-name: unpin release pins
    description: 'Unpin all pins from a release, typically used ahead of a release drain. Only for use in environments where a versioning-manager is used, e.g., JaaS.'
    concurrent: true
    parameters:
      - string:
          name: RELEASE_NUMBER
          default:
          description: "The release number to unpin all tenants from."
          trim: true
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - infra-branch-param
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/unpin-release-pins/Jenkinsfile
      lightweight-checkout: true
