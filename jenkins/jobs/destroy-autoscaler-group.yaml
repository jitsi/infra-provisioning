- job:
    name: destroy-autoscaler-group
    display-name: destroy autoscaler group
    concurrent: true
    parameters:
      - string:
          name: VIDEO_INFRA_BRANCH
          default: main
          description: "Controls checkout branch for infra repos, defaults to 'main'."
          trim: true
      - string:
          name: ENVIRONMENT
          description: "Environment of the group to destroy."
          trim: true
      - string:
          name: TYPE
          description: "Type of group to destroy, e.g. JVB, jibri, sip-jibri, jigasi, nomad."
          trim: true
      - string:
          name: ORACLE_REGION
          description: "Region of the group to destroy. If empty, resolved from the autoscaler group record."
          trim: true
      - string:
          name: AUTOSCALER_BACKEND
          description: "Used to control which autoscaler to target."
          trim: true
      - string:
          name: GROUP_NAME
          description: "The exact autoscaler group name to destroy (required)."
          trim: true
      - bool:
          name: FORCE_IMMEDIATE_DELETE
          default: false
          description: "If true, skip the graceful-drain wait and force-terminate/delete immediately."
      - string:
          name: INFRA_CUSTOMIZATIONS_REPO
          default: git@github.com:jitsi/infra-customizations.git
          description: "Repo with customized configurations, defaults to 'git@github.com:jitsi/infra-customizations.git'."
          trim: true

    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - git:
            url: git@github.com:jitsi/infra-provisioning.git
            credentials-id: "video-infra"
            branches:
              - "origin/${{VIDEO_INFRA_BRANCH}}"
            browser: githubweb
            browser-url: https://github.com/jitsi/infra-provisioning
            submodule:
              recursive: true
      script-path: jenkins/groovy/destroy-autoscaler-group/Jenkinsfile
      lightweight-checkout: true
