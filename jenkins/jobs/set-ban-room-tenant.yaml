- job:
    name: set-ban-room-tenant
    display-name: set ban room tenant
    description: 'Ban or unban a room or tenant in an environment'
    concurrent: true
    parameters:
      - string:
          name: BAN_ROOM
          description: "Room name to ban"
          trim: true
      - string:
          name: BAN_TENANT
          description: "Tenant name to ban"
          trim: true
      - string:
          name: UNBAN_ROOM
          description: "Room name to unban"
          trim: true
      - string:
          name: UNBAN_TENANT
          description: "Room name to ban"
          trim: true
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/set-ban-room-tenant/Jenkinsfile
      lightweight-checkout: true
