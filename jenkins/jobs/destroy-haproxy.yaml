- job:
    name: destroy-haproxy
    display-name: destroy HAProxy
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          description: "Environment to find stack in"
          trim: true
      - string:
          name: ORACLE_REGION
          description: "Oracle Region to destroy in"
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/destroy-haproxy/Jenkinsfile
      lightweight-checkout: true
