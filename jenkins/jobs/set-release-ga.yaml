- job:
    name: set-release-ga
    display-name: set release GA
    description: 'Mark a release as GA, i.e., the default release that new traffic goes to.'
    concurrent: true
    parameters:
      - string:
          name: RELEASE_NUMBER
          default:
          description: "The release number to set as GA."
          trim: true
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - infra-repo-params
      - bool:
          name: GOVERNANCE_ENABLED
          default: true
          description: "Send a governance post-enable notification when the release is set GA."
      - bool:
          name: GOVERNANCE_STAGING
          default: false
          description: "Use the governance staging endpoint instead of production."
      - bool:
          name: GOVERNANCE_VERBOSE
          default: false
          description: "Mirror governance hook detail to the console."
      - string:
          name: RP_TICKET
          default:
          description: "Release Package ticket (RP-<number>) for the release being promoted; recorded as the post-enable release key."
          trim: true

    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/set-release-ga/Jenkinsfile
      lightweight-checkout: true
