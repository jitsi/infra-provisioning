- job:
    name: demote-release
    display-name: demote release
    concurrent: true
    parameters:
      - string:
          name: ENVIRONMENT
          description: "Environment to demote release"
          trim: true
      - string:
          name: RELEASE_NUMBER
          description: "Release number to demote"
          trim: true
      - string:
          name: CLOUDS
          description: "Clouds to demote resources"
          trim: true
      - infra-branch-param
      - string:
          name: CLOUD_PROVIDER
          default: oracle
          description: "Cloud Provider, defaults to 'oracle'"
          trim: true
      - string:
          name: JVB_VERSION
          description: "Controls the version of JVB to launch for global pools"
          trim: true
      - string:
          name: DRAIN_WAIT_PERIOD
          description: "Seconds to wait before deleting shards after drain"
          default: 21600
          trim: true
      - string:
          name: POOL_DRAIN_WAIT_PERIOD
          description: "Seconds to wait before deleting pools after drain"
          default: 3600
          trim: true
      - infra-repo-params

    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/demote-release/Jenkinsfile
      lightweight-checkout: true