- job:
    name: provision-jigasi
    display-name: provision jigasi
    concurrent: true
    parameters:
      - string:
          name: JIGASI_VERSION
          description: "Controls the version of jigasi to build."
          trim: true
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - string:
          name: CLOUD_PROVIDER
          default: oracle
          description: "Cloud Provider, defaults to 'oracle'"
          trim: true
      - string:
          name: RELEASE_BRANCH
          default: main
          description: "Name of an existing infra branch to use when creating the release, defaults to 'main'."
          trim: true
      - string:
          name: CLOUD_NAME
          description: "Name of cloud to build in"
          trim: true
      - string:
          name: JIGASI_TRANSCRIBER_FLAG
          description: "Controls whether to deploy a transcriber or traditional jigasi, set to 'true' for transcriber"
          trim: true
      - string:
          name: JIGASI_RELEASE_NUMBER
          description: "Release number with which to tag all jigasi instances"
      - string:
          name: SHAPE
          description: "VM Instance shape for jigasi"
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/provision-jigasi/Jenkinsfile
      lightweight-checkout: true
