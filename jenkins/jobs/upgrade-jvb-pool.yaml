- job:
    name: upgrade-jvb-pool
    display-name: upgrade JVB pool
    concurrent: true
    parameters:
      - string:
          name: JVB_VERSION
          description: "Controls the version of JVB to launch."
          trim: true
      - string:
          name: SHARD
          description: "Name of shard/pool to upgrade"
          trim: true
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - string:
          name: CLOUD_PROVIDER
          default: oracle
          description: "Cloud Provider, defaults to 'oracle'"
          trim: true
      - string:
          name: RELEASE_BRANCH
          default: main
          description: "Name of an existing infra branch to use when creating the release, defaults to 'main'."
          trim: true
      - string:
          name: ORACLE_REGION
          description: "Name of oracle region to provision in"
          trim: true
      - string:
          name: CLOUD_NAME
          description: "Name of cloud to provision in"
          trim: true
      - string:
          name: RELEASE_NUMBER
          description: "Release number where shard or pool exists"
      - string:
          name: JVB_RELEASE_NUMBER
          description: "JVB Release number with which to tag all JVB instances"
      - string:
          name: SHAPE
          description: "Override JVB shape"
          trim: true
      - string:
          name: OCPUS
          description: "Override JVB CPU count"
          trim: true
      - string:
          name: MEMORY_IN_GBS
          description: "Override JVB memory"
          trim: true
      - string:
          name: SKIP_SCALE_DOWN
          description: "Set to true to only update instance configuration, skip rotation"
          trim: true
      - string:
          name: SKIP_HEALTH_CHECK
          description: "Set to true to skip the new-instance health gate and use the legacy fixed wait before scale down"
          trim: true
      - string:
          name: HEALTH_CHECK_TIMEOUT
          description: "Seconds to wait for new JVBs to report healthy before failing the rotation, defaults to 900"
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/upgrade-jvb-pool/Jenkinsfile
      lightweight-checkout: true
