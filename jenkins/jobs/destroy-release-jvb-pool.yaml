- job:
    name: destroy-release-jvb-pool
    display-name: destroy release JVB pool
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          description: "Environment to find JVB pool in."
          trim: true
      - string:
          name: RELEASE_NUMBER
          description: "Release to find JVB pool in."
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/destroy-release-jvb-pool/Jenkinsfile
      lightweight-checkout: true
