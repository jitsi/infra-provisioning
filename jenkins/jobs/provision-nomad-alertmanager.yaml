- job:
    name: provision-nomad-alertmanager
    display-name: provision nomad alertmanager
    description: "release alertmanager in nomad to an oracle region in an environment"
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          description: "Environment to provision in"
          trim: true
      - string:
          name: ORACLE_REGION
          description: "Region to provision in"
          trim: true
      - string:
          name: GLOBAL_ALERTMANAGER
          description: "Set 'true' if this is a global alertmanager"
          trim: true
      - string:
          name: JOB_TYPE
          default: alertmanager
          description: "Nomad job type to provision, defaults to 'alertmanager' do not change"
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/provision-nomad-job/Jenkinsfile
      lightweight-checkout: true
