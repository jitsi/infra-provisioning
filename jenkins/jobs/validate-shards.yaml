- job:
    name: validate-shards
    display-name: validate shards
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          description: "Environment to find JVB pool in."
          trim: true
      - string:
          name: SHARDS
          description: "Shards to validate."
      - string:
          name: GRID_URL
          description: "Override grid URL to use for validate"
      - string:
          name: TORTURE_BRANCH
          description: "Branch for torture test checkout, defaults to version for shard"
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/validate-shards/Jenkinsfile
      lightweight-checkout: true
