- job:
    name: provision-nomad-autoscaler
    display-name: provision nomad autoscaler
    concurrent: true
    parameters:
      - string:
          name: AUTOSCALER_VERSION
          description: "Controls the version of autoscaler to run."
          trim: true
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          description: "Environment to provision in"
          trim: true
      - string:
          name: ORACLE_REGION
          description: "Region to provision in"
          trim: true
      - string:
          name: JOBS_CONCURRENCY
          description: "The number of concurrent jobs the autoscaler can run, defaults to 5."
          trim: true
      - string:
          name: JOB_TYPE
          default: autoscaler
          description: "Nomad job type to provision, defaults to 'autoscaler' do not change"
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/provision-nomad-job/Jenkinsfile
      lightweight-checkout: true
