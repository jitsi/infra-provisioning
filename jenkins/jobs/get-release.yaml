- job:
    name: get-release
    display-name: get release
    description: 'Get info for a release.'
    concurrent: true
    parameters:
      - string:
          name: RELEASE_NUMBER
          default:
          description: "The release number to look up."
          trim: true
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/get-release/Jenkinsfile
      lightweight-checkout: true
