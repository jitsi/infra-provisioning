- job:
    name: provision-nomad-alloy-external
    display-name: provision nomad alloy-external
    description: "release alloy-external in nomad to an oracle region in an environment"
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          description: "Environment to provision in"
          trim: true
      - string:
          name: ORACLE_REGION
          description: "Region to provision in"
          trim: true
      - string:
          name: JOB_TYPE
          default: alloy-external
          description: "Nomad job type to provision, defaults to 'alloy-external' do not change"
          trim: true
      - infra-repo-params

    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/provision-nomad-job/Jenkinsfile
      lightweight-checkout: true
