- job:
    name: release-nomad-wavefront-proxy
    display-name: release nomad wavefront proxy
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - string:
          name: CLOUDS
          description: "Clouds to build in, defaults to RELEASE_CLOUDS for environment."
          trim: true
      - infra-repo-params
      - governance-params

    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/release-nomad-wavefront-proxy/Jenkinsfile
      lightweight-checkout: true
