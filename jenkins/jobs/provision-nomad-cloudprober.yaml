- job:
    name: provision-nomad-cloudprober
    display-name: provision nomad cloudprober
    description: "release cloudprober in nomad to an oracle region in an environment"
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          description: "Environment to provision in"
          trim: true
      - string:
          name: ORACLE_REGION
          description: "Region to provision in"
          trim: true
      - string:
          name: JOB_TYPE
          default: cloudprober
          description: "Nomad job type to provision, defaults to 'cloudprober' do not change"
          trim: true
      - string:
          name: TEMPLATE_TYPE_OVERRIDE
          description: "Overrides the CLOUDPROBER_TEMPLATE_TYPE - can be base, core, or ops"
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/provision-nomad-job/Jenkinsfile
      lightweight-checkout: true
