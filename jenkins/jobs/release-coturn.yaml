- job:
    name: release-coturn
    display-name: release coTURN
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - string:
          name: CLOUD_PROVIDER
          default: oracle
          description: "Cloud Provider, defaults to 'oracle'"
          trim: true
      - string:
          name: RELEASE_BRANCH
          description: "Name of an existing infra branch to use when creating the release, otherwise tagged as haproxy-release-$BUILD_ID."
          trim: true
      - string:
          name: CLOUDS
          description: "Name of cloud to build in, for AWS"
          trim: true
      - infra-repo-params
      - governance-params

    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/release-coturn/Jenkinsfile
      lightweight-checkout: true
