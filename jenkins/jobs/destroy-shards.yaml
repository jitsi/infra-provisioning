- job:
    name: destroy-shards
    display-name: destroy shards
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          description: "Environment to find JVB pool in."
          trim: true
      - string:
          name: SHARDS
          description: "Pool mode for JVBs, defaults to 'global'"
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/destroy-shards/Jenkinsfile
      lightweight-checkout: true
