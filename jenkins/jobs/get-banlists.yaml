- job:
    name: get-banlists
    display-name: get ban lists
    description: "List the banlists in the environment"
    concurrent: true
    parameters:
      - string:
          name: BAN_TYPE
          default: ALL
          description: "Type of ban to list. Valid choices are 'ALL', 'domain', 'exact', 'prefix', and 'substr'. domain: exact match of a domain name; exact: exact match of a room name; prefix: prefix of a room name; substr: a substring anywhere in the path or room name"
          trim: true
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/get-banlists/Jenkinsfile
      lightweight-checkout: true
