- job:
    name: rotate-consul
    display-name: rotate consul
    description: 'Gracefully replace consul cluster in an environment/region with a new cluster.'      
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - string:
          name: SHAPE
          description: "Instance shape for consul servers"
          trim: true
      - string:
          name: OCPUS
          description: "Override CPU count"
          trim: true
      - string:
          name: MEMORY_IN_GBS
          description: "Override memory"
          trim: true
      - string:
          name: RELEASE_BRANCH
          default: main
          description: "Name of an existing infra branch to use when creating the release, defaults to 'main'."
          trim: true
      - string:
          name: ORACLE_REGION
          description: "Oracle Region to build in"
          trim: true
      - infra-repo-params
      - governance-params

    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/rotate-consul/Jenkinsfile
      lightweight-checkout: true
