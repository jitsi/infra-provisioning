- job:
    name: reconfigure-shard-states
    display-name: reconfigure shard states
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - string:
          name: SHARDS_READY
          description: "List of shards to set to 'ready' state"
          trim: true
      - string:
          name: SHARDS_DRAIN
          description: "List of shards to set to 'drain' state"
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/reconfigure-shard-states/Jenkinsfile
      lightweight-checkout: true
