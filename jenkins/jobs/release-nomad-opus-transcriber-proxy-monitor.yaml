- job:
    name: release-nomad-opus-transcriber-proxy-monitor
    display-name: release nomad opus-transcriber-proxy-monitor
    description: "release the opus-transcriber-proxy transcription monitor to nomad in one or more regions in an environment."
    concurrent: true
    parameters:
      - string:
          name: VIDEO_INFRA_BRANCH
          default: main
          description: "Controls checkout branch for infra repos, defaults to 'main'."
          trim: true
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - string:
          name: REGIONS
          description: "REGIONS to build in, defaults to NOMAD_REGIONS for the environment."
          trim: true
      - string:
          name: JOB_TYPE
          default: opus-transcriber-proxy-monitor
          description: "Nomad job type to release, defaults to 'opus-transcriber-proxy-monitor' do not change"
          trim: true
      - string:
          name: OPUS_TRANSCRIBER_PROXY_MONITOR_IMAGE
          description: "Required: the opus-transcriber-proxy image to release. Must be a full image reference (repo:tag), not a bare commit hash - e.g. jitsi/opus-transcriber-proxy:1234abc using the short 7-char commit SHA tag published by the repo's dh.yml workflow. Do not use the 'latest' tag: re-running with the same image string is a no-op for Nomad (job diff sees no change and won't redeploy), so pin an explicit SHA tag every time."
          trim: true
      - string:
          name: OPUS_TRANSCRIBER_PROXY_MONITOR_INTERVAL_SECONDS
          description: "Override for how often the monitor replays the test, in seconds. Leave blank to use the site's opus_transcriber_proxy_monitor_interval_seconds (default 300)."
          trim: true
      - string:
          name: INFRA_CONFIGURATION_REPO
          default: git@github.com:jitsi/infra-configuration.git
          description: "Repo for configuration code (ansible etc), defaults to 'git@github.com:jitsi/infra-configuration.git'."
          trim: true
      - string:
          name: INFRA_CUSTOMIZATIONS_REPO
          default: git@github.com:jitsi/infra-customizations-private.git
          description: "Repo with customized configurations, defaults to 'git@github.com:jitsi/infra-customizations-private.git'."
          trim: true
      - governance-params

    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/release-nomad-job/Jenkinsfile
      lightweight-checkout: true
