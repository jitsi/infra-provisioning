- job:
    name: set-banlist
    display-name: set ban list
    description: "Ban or unban a room or domain based on a string match."
    concurrent: true
    parameters:
      - string:
          name: BAN_STRINGS
          description: "Space-delimited list of strings to match the ban against. For the case of a room pattern for a specific tenant, use a ban string in this form: tenantname___roomtoban along with the 'substr' BAN_TYPE."
          trim: true
      - string:
          name: BAN_TYPE
          default: exact
          description: "Type of ban. Valid choices are 'domain', 'exact', 'prefix', and 'substr'. domain: exact match of a domain name; exact: exact match of a room name; prefix: prefix of a room name; substr: a substring anywhere in the path or room name."
          trim: true
      - string:
          name: BAN_ACTION
          default: BAN
          description: "BAN or UNBAN the string"
          trim: true
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/set-banlist/Jenkinsfile
      lightweight-checkout: true
