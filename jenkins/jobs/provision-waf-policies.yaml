- job:
    name: provision-waf-policies
    display-name: provision WAF policies
    description: 'Provision or update WAF policies for an envirionent in all regions based on their definition in ingress-waf-policy.tf.'
    concurrent: true
    parameters:
      - infra-branch-param
      - string:
          name: ENVIRONMENT
          default: ops-dev
          description: "Environment to build in, defaults to 'ops-dev'."
          trim: true
      - infra-repo-params
 
    project-type: pipeline
    sandbox: true
    pipeline-scm:
      scm:
        - infra-provisioning-checkout
      script-path: jenkins/groovy/provision-waf-policies/Jenkinsfile
      lightweight-checkout: true
